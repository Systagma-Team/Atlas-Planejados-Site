# Mantém o banco ativo chamando /api/health duas vezes por dia.
# Uso: suba o projeto para um repositório no GitHub e cadastre o segredo HEALTH_URL
# (Settings > Secrets and variables > Actions), por exemplo: https://www.seudominio.com.br/api/health
name: keep-alive

on:
  schedule:
    - cron: "17 9,21 * * *" # 09:17 e 21:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/health
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          # Enquanto o site não estiver publicado, não há o que chamar: avisa e encerra sem erro.
          if [ -z "$HEALTH_URL" ]; then echo "::notice::Segredo HEALTH_URL ainda não configurado; nada a fazer."; exit 0; fi
          # Tenta até 3 vezes (o site pode estar "acordando"); falha o job se não responder 200.
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL" || echo 000)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
