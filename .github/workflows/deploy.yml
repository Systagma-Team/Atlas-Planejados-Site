name: Publicar site (GitHub Pages)

# A cada envio para a branch main, gera o site estático (pasta out/) e publica no GitHub Pages.
# Requisitos: repositório público (ou plano pago do GitHub) e, em Settings → Pages, "Source: GitHub Actions".
# Variáveis opcionais (Settings → Secrets and variables → Actions → Variables):
#   BASE_PATH  → só se o site ficar num subcaminho, ex.: /Atlas-Planejados-Site (usuario.github.io/repositorio).
#                Com domínio próprio, deixe em branco.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
